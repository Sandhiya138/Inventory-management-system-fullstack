# ==============================================================================
# VelvetStock Inventory Management System - Production Configuration
# ==============================================================================

# Application & Server Port Configuration
# Cloud providers like Render supply the PORT environment variable dynamically (e.g. 10000)
spring.application.name=inventory-management-backend
server.port=${PORT:8080}

# ==============================================================================
# MySQL Database Configuration
# ==============================================================================
# Supports:
# 1) Full JDBC connection URL via SPRING_DATASOURCE_URL
# 2) Standard credentials via DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD
# 3) Railway native MySQL variables (MYSQLHOST, MYSQLPORT, MYSQLDATABASE, MYSQLUSER, MYSQLPASSWORD)
# 4) Default fallback to local MySQL: localhost:3306/inventory_management (root / 1234)
spring.datasource.url=${SPRING_DATASOURCE_url:${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:${MYSQLHOST:localhost}}:${DB_PORT:${MYSQLPORT:3306}}/${DB_NAME:${MYSQLDATABASE:inventory_management}}?createDatabaseIfNotExist=true&useSSL=${DB_SSL:false}&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:1234}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Settings (Optimized for Cloud Database Tiers)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=30000

# ==============================================================================
# JPA / Hibernate Configuration
# ==============================================================================
# 'update' automatically updates table schema without deleting existing production data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ==============================================================================
# JWT Security Configuration
# ==============================================================================
# In production, pass your secure 256-bit secret via JWT_SECRET environment variable
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D6351}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==============================================================================
# CORS Configuration
# ==============================================================================
# Set FRONTEND_URL to your deployed Vercel domain (e.g. https://velvetstock.vercel.app)
# Supports comma-separated list of allowed origins (e.g. https://velvetstock.vercel.app,http://localhost:3000)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:5173}

# ==============================================================================
# Seed Demo Data Control
# ==============================================================================
# Set to 'false' in production if you do not want demo catalog and seed users inserted into production DB
app.seed-demo-data=${SEED_DEMO_DATA:true}

# ==============================================================================
# Error Handling (Production Protection)
# ==============================================================================
# Hides internal JVM stack traces and raw SQL exceptions from end users
server.error.include-stacktrace=never
server.error.include-message=always

# Logging
logging.level.com.inventory.management=INFO
logging.level.org.springframework.security=WARN
